name: Deploy Sami Says to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        id: website
        env:
          SAMI_BACKEND_URL: ${{ vars.SAMI_BACKEND_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f docs/index.html ]; then
            source_root="$GITHUB_WORKSPACE"
          elif [ -f project/docs/index.html ]; then
            source_root="$GITHUB_WORKSPACE/project"
          elif [ -f project_fixed.zip ]; then
            unzip -q project_fixed.zip -d "$RUNNER_TEMP/sami-source"
            source_root="$RUNNER_TEMP/sami-source/project"
          else
            echo 'No website found. Upload the corrected source files or project_fixed.zip.' >&2
            exit 1
          fi
          test -f "$source_root/docs/index.html"
          test -f "$source_root/docs/developer/index.html"
          if [ -n "$SAMI_BACKEND_URL" ]; then
            node "$source_root/scripts/build-static.js"
          fi
          echo "path=$source_root/docs" >> "$GITHUB_OUTPUT"
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.website.outputs.path }}
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
